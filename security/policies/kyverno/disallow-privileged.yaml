apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Zero Trust Pod Security
    policies.kyverno.io/severity: critical
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-privileged
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [agentic-zero-trust]
      validate:
        message: "Privileged containers are not allowed in the zero trust namespace."
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): "false"
    - name: disallow-host-namespaces
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [agentic-zero-trust]
      validate:
        message: "Host network, PID, and IPC namespaces are not allowed."
        pattern:
          spec:
            =(hostNetwork): "false"
            =(hostPID): "false"
            =(hostIPC): "false"
    - name: disallow-host-path
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [agentic-zero-trust]
      validate:
        message: "HostPath volumes are not allowed."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.volumes[].hostPath | length(@) }}"
                operator: GreaterThan
                value: "0"
