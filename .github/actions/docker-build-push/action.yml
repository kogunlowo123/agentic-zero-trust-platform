name: Docker Build and Push
description: >
  Builds a Docker image with Buildx, tags it for the Azure Container Registry,
  and optionally pushes it. Produces a signed SBOM and provenance attestation.

inputs:
  image-name:
    description: Docker image name without the registry prefix (e.g. agentic-zero-trust/api)
    required: true
  dockerfile:
    description: Path to the Dockerfile relative to the build context
    required: false
    default: "Dockerfile"
  context:
    description: Build context path
    required: false
    default: "."
  registry:
    description: Container registry FQDN (e.g. myregistry.azurecr.io)
    required: true
  registry-username:
    description: Registry login username
    required: true
  registry-password:
    description: Registry login password or token
    required: true
  image-tag:
    description: Primary image tag (e.g. 1.2.3 or latest)
    required: false
    default: "latest"
  push:
    description: Whether to push the image to the registry after building
    required: false
    default: "true"
  build-args:
    description: Additional Docker build arguments (newline-separated KEY=VALUE pairs)
    required: false
    default: ""

outputs:
  image-digest:
    description: The digest (sha256:…) of the built/pushed image
    value: ${{ steps.build-push.outputs.digest }}
  image-url:
    description: Full image URL with the primary tag
    value: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
  image-tags:
    description: All tags applied to this image (newline-separated)
    value: ${{ steps.meta.outputs.tags }}

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU (for multi-arch builds)
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          image=moby/buildkit:buildx-stable-1
          network=host

    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.image-name }}
        tags: |
          type=raw,value=${{ inputs.image-tag }}
          type=sha,prefix=sha-,format=short
          type=ref,event=branch
        labels: |
          org.opencontainers.image.title=${{ inputs.image-name }}
          org.opencontainers.image.vendor=agentic-zero-trust-platform contributors

    - name: Build and push Docker image
      id: build-push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: mode=max
        sbom: true
        platforms: linux/amd64

    - name: Output image details
      shell: bash
      run: |
        echo "Image digest: ${{ steps.build-push.outputs.digest }}"
        echo "Image URL: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}"
        echo "All tags:"
        echo "${{ steps.meta.outputs.tags }}"
