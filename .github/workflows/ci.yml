name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run ruff linting
        run: uv run ruff check . --output-format=github

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run mypy type checking
        run: uv run mypy services/ --ignore-missing-imports --strict --show-error-codes

  test-unit:
    name: Unit Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, rag-core, agent-runtime]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run unit tests for ${{ matrix.service }}
        run: |
          uv run pytest tests/unit/${{ matrix.service }}/ \
            -v \
            --cov=services/${{ matrix.service }} \
            --cov-report=xml:coverage-${{ matrix.service }}.xml \
            --cov-report=term-missing \
            --cov-fail-under=80
        env:
          ENVIRONMENT: test
          LOG_LEVEL: WARNING
          JWT_SECRET_KEY: test-secret-key-minimum-32-characters-long
          JWT_ALGORITHM: HS256

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          file: coverage-${{ matrix.service }}.xml
          flags: unit-${{ matrix.service }}
          fail_ci_if_error: false

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zerotrust_test
          POSTGRES_USER: ztplatform
          POSTGRES_PASSWORD: ztplatform_test_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      opa:
        image: openpolicyagent/opa:latest
        ports:
          - 8181:8181
        options: >-
          --health-cmd "wget -qO- http://localhost:8181/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          OPA_ARGS: "run --server --addr 0.0.0.0:8181 --log-format json"

      opensearch:
        image: opensearchproject/opensearch:2.13.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Wait for OPA to be ready
        run: |
          until curl -sf http://localhost:8181/health; do
            echo "Waiting for OPA..."; sleep 2
          done

      - name: Load OPA policies
        run: |
          if [ -f policies/zerotrust.rego ]; then
            curl -X PUT http://localhost:8181/v1/policies/zerotrust \
              -H "Content-Type: text/plain" \
              --data-binary @policies/zerotrust.rego
            echo "OPA policies loaded."
          else
            echo "No policies/zerotrust.rego found, skipping."
          fi

      - name: Run integration tests
        run: |
          uv run pytest tests/integration/ \
            -v \
            --timeout=60 \
            --cov=services \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing
        env:
          DATABASE_URL: postgresql://ztplatform:ztplatform_test_secret@localhost:5432/zerotrust_test
          REDIS_URL: redis://localhost:6379/0
          OPA_URL: http://localhost:8181
          OPENSEARCH_URL: http://localhost:9200
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key-minimum-32-characters-long
          JWT_ALGORITHM: HS256
          LOG_LEVEL: WARNING

      - name: Upload integration coverage
        uses: codecov/codecov-action@v7
        with:
          file: coverage-integration.xml
          flags: integration
          fail_ci_if_error: false

  test-security:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Bandit SAST
        run: |
          uv run bandit -r services/ -ll -f json -o bandit-report.json || true
          uv run bandit -r services/ -ll -f txt

      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

      - name: Run safety vulnerability check
        run: uv run safety check --full-report

      - name: Run pytest security tests
        run: |
          uv run pytest tests/security/ -v
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key-minimum-32-characters-long

  build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          tags: agentic-zero-trust/api:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
