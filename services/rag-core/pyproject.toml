[project]
name = "rag-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.0",
    "psycopg2-binary",
    "pgvector",
    "opensearch-py>=2.4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "numpy",
    "torch",
    "transformers",
    "openai>=1.30",
    "azure-identity>=1.16",
    "azure-search-documents>=11.6",
    "tenacity>=8.3",
    "structlog>=24.1",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "langdetect>=1.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]

[tool.hatch.build.targets.editable]
packages = ["src/rag_core"]
