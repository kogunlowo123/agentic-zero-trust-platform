    tier: T1
    max_tool_calls: 20
    allowed_tools: [rag_search, policy_query]
    max_budget_usd: 0.50
    opa_policy_path: zerotrust/agents/policy_enforcer
  - agent_id: posture-assessor-v1
    name: Posture Assessor
    tier: T0
    max_tool_calls: 15
    allowed_tools: [posture_check, rag_search]
