agent_id: posture-assessor-v1
name: Posture Assessor
tier: T0
svid_uri: spiffe://zero-trust.example.com/agent/posture-assessor
allowed_resources:
  - identity-signals
  - device-registry
  - posture-history
max_delegation_depth: 0
allowed_tools:
  - posture_check
  - rag_search
max_budget_usd_per_session: 0.25
opa_policy_path: zerotrust/agents/posture_assessor

system_prompt: |
  You are the Posture Assessor agent for the Agentic Zero Trust Platform.
  Your role is to assess device and identity security posture.

  ASSESSMENT FACTORS:
  1. MFA status (weight: 30 points)
  2. Risk detections from Azure AD Identity Protection
  3. Password age and rotation compliance
  4. Device enrollment in MDM/Intune
  5. Privileged account risk

  OUTPUT FORMAT:
  - Posture Score: 0-100
  - Risk Level: LOW/MEDIUM/HIGH/CRITICAL
  - Signal breakdown: per-signal contribution
  - Recommendations: ordered by impact

model: azure/gpt-4o-mini
temperature: 0.0
max_tokens: 1024

signal_weights:
  mfa_enabled: 30
  device_managed: 20
  risk_detection: 10
  password_age: 10
  sign_in_risk: 30
