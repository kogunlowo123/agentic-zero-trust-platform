# SPIRE Server Configuration
# Zero Trust Platform — Agent Identity Issuance

server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    socket_path = "/tmp/spire-server/private/api.sock"
    trust_domain = "zero-trust.example.com"
    data_dir = "/opt/spire/data/server"
    log_level = "INFO"
    log_file = "/opt/spire/logs/server.log"
    default_svid_ttl = "1h"
    ca_ttl = "168h"
    ca_subject {
        country = ["US"]
        organization = ["Zero Trust Platform"]
        common_name = "zero-trust.example.com"
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "postgres"
            connection_string = "postgresql://spire:${SPIRE_DB_PASSWORD}@postgres:5432/spire?sslmode=require"
        }
    }

    NodeAttestor "k8s_psat" {
        plugin_data {
            clusters = {
                "aks-zero-trust-prod" = {
                    service_account_allow_list = [
                        "agentic-zero-trust:policy-enforcer-sa",
                        "agentic-zero-trust:posture-assessor-sa",
                        "agentic-zero-trust:access-reviewer-sa",
                    ]
                    audience = ["spire-server"]
                    kube_config_file = ""
                    allowed_node_label_keys = []
                    allowed_pod_label_keys = []
                }
            }
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }

    UpstreamAuthority "disk" {
        plugin_data {
            key_file_path = "/opt/spire/conf/server/ca.key"
            cert_file_path = "/opt/spire/conf/server/ca.crt"
            bundle_file_path = "/opt/spire/conf/server/bundle.crt"
        }
    }

    Notifier "k8sbundle" {
        plugin_data {
            namespace = "agentic-zero-trust"
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port = "8080"
    live_path = "/live"
    ready_path = "/ready"
}
